name: Playwright E2E Tests (CI/CD)

on:
  push:
    branches: [ main, master, 'pmpl/**', '**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-e2e:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: PBL_Poliklinik

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Setup PHP & Ekstensi untuk Laravel
      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, bcmath
          coverage: none

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: PBL_Poliklinik/package-lock.json

      # 3. Install Composer Dependencies (Laravel & Filament)
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # 4. Install NPM Dependencies & Build Frontend Assets (Vite)
      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      # 5. Konfigurasi Environment & SQLite Database untuk Testing
      - name: Setup Testing Database & Environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/g' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=database\/database.sqlite/g' .env
          php artisan key:generate
          php artisan migrate:fresh --seed

      # 6. Install Browser Playwright (Chromium)
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # 7. Jalankan Pengujian Playwright E2E
      - name: Run Playwright Tests
        run: npx playwright test

      # 8. Upload Artifact Laporan Hasil Uji (Report & Trace)
      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: PBL_Poliklinik/playwright-report/
          retention-days: 14
